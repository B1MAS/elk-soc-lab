services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.26
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.26
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.26
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./pipeline:/usr/share/logstash/pipeline:ro
      - ./samples:/samples:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
volumes:
  elastic-data:
