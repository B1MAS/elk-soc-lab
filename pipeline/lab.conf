input {
  file {
    path => "/samples/events.jsonl"
    mode => "read"
    file_completed_action => "log"
    file_completed_log_path => "/usr/share/logstash/data/completed.log"
    codec => json
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "soc-lab-events"
    ilm_enabled => false
    document_id => "%{[event][id]}"
  }
}
